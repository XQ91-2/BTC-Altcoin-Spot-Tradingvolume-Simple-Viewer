<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total / BTC spot volume</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#6b7280;--line:#e5e7eb;--btc:#111}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e9eb;--mut:#8b919b;--line:#2a2e35;--btc:#f2f2f2}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 20px}
h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
p.sub{color:var(--mut);margin:0 0 20px;max-width:70ch}
.ctl{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input[type=password]{width:210px}input[type=number]{width:80px}
button{background:var(--fg);color:var(--bg);border-color:var(--fg);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:8px}
.chk input{padding:0}
#status{font-size:13px;color:var(--mut);min-height:20px;margin-bottom:8px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:0 0 6px auto;width:max-content}
.legend i{display:block;width:180px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(120 65% 45%),hsl(60 65% 45%),hsl(0 65% 45%))}
canvas{width:100%;height:560px;display:block}
#wrap{position:relative}#o{position:absolute;left:0;top:0}
#read{font-size:13px;color:var(--mut);min-height:20px}
</style>
</head>
<body>
<main>
<h1>Total / BTC spot volume</h1>
<p class="sub">Sums daily volume of the top coins from CoinGecko, divides by BTC volume, smooths over 7 days, and colors the BTC price by the result.</p>
<div class="ctl">
  <label>API key<input id="key" type="password" placeholder="CoinGecko key" autocomplete="off"></label>
  <label>Plan<select id="plan"><option value="demo">Demo (free, 365 days max)</option><option value="pro">Pro / Analyst</option></select></label>
  <label>Coins<select id="n"><option value="30">30</option><option value="100">100</option><option value="200">200</option><option value="500">500</option></select></label>
  <label>Range<select id="days"><option value="365">1 year</option><option value="730">2 years</option><option value="1460">4 years</option></select></label>
  <label>Green threshold<select id="gs"><option value="1">Normal</option><option value="2" selected>Strict</option><option value="3">Stricter</option></select></label>
  <label class="chk"><input id="stab" type="checkbox" checked>Exclude stablecoins and wrapped assets</label>
  <label class="chk"><input id="rem" type="checkbox">Save on this device (insecure, not recommended)</label>
  <button id="go">Load data</button>
</div>
<div id="status">Enter your key and select Load data. Demo keys only allow 365 days.</div>
<div class="legend"><span>Bitcoin-led</span><i></i><span>alt froth</span></div>
<div id="wrap"><canvas id="c"></canvas><canvas id="o"></canvas></div>
<div id="read"></div>
</main>
<script>
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STABLES=new Set(['tether','usd-coin','dai','usds','first-digital-usd','ethena-usde','usd1-wlfi','paypal-usd','binance-usd','true-usd','usdd','global-dollar','ripple-usd','usdt0','staked-ether','wrapped-steth','wrapped-bitcoin','weth','wrapped-eeth','coinbase-wrapped-btc','wrapped-beacon-eth','usdtb','susds','ethena-staked-usde','binance-staked-sol']);
const setStatus=t=>$('status').textContent=t;
let S=null;const CACHE={};

async function api(path){
  const pro=$('plan').value==='pro';
  const base=pro?'https://pro-api.coingecko.com/api/v3':'https://api.coingecko.com/api/v3';
  const k=$('key').value.trim();
  const url=base+path+(k?`&${pro?'x_cg_pro_api_key':'x_cg_demo_api_key'}=${encodeURIComponent(k)}`:'');
  for(let i=0;i<6;i++){
    let r;
    try{r=await fetch(url)}
    catch(e){setStatus(`Network error on ${path.split('?')[0]}, retrying in ${10*(i+1)}s (attempt ${i+1}/6)…`);await sleep(10000*(i+1));continue}
    if(r.status===429){setStatus('Rate limited, waiting…');await sleep(15000*(i+1));continue}
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,140));
    return r.json();
  }
  throw new Error('Request kept failing for '+path.split('?')[0]+'. Check for an ad blocker or privacy extension blocking api.coingecko.com, or try another browser. Select Load data to resume.');
}

async function run(){
  const n=+$('n').value, days=$('days').value;
  $('go').disabled=true;
  try{
    setStatus('Loading top coins…');
    let mk=[];
    for(let pg=1;mk.length<n+30&&pg<=4;pg++){mk=mk.concat(await api(`/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${pg}`));await sleep(700)}
    let ids=mk.map(c=>c.id).filter(id=>id!=='bitcoin'&&!($('stab').checked&&STABLES.has(id))).slice(0,n-1);
    ids.unshift('bitcoin');
    const tot=new Map(), btc=new Map(), price=new Map();
    for(let i=0;i<ids.length;i++){
      setStatus(`Fetching ${ids[i]} (${i+1}/${ids.length})…`);
      const ck=ids[i]+days, hit=!!CACHE[ck];
      const d=CACHE[ck]||(CACHE[ck]=await api(`/coins/${ids[i]}/market_chart?vs_currency=usd&days=${days}&interval=daily`));
      for(const [t,v] of d.total_volumes){const k=Math.floor(t/864e5);tot.set(k,(tot.get(k)||0)+v);if(i===0)btc.set(k,v)}
      if(i===0) for(const [t,p] of d.prices) price.set(Math.floor(t/864e5),p);
      if(!hit) await sleep(750);
    }
    build(tot,btc,price);
    setStatus(`Done: ${ids.length} coins, ${S.d.length} days. Use ← → (Shift = 7 days, Home/End) to move the crosshair.`);
  }catch(e){setStatus('Error: '+e.message)}
  $('go').disabled=false;
  if(document.activeElement) document.activeElement.blur();
}

function build(tot,btc,price){
  const keys=[...btc.keys()].sort((a,b)=>a-b).slice(0,-1); // drop partial current day
  const d=[],p=[],r=[];
  keys.forEach((k,i)=>{
    if(i<6) return;
    let a=0,b=0;
    for(let j=i-6;j<=i;j++){a+=tot.get(keys[j])||0;b+=btc.get(keys[j])||0}
    if(!b||!price.get(k)) return;
    d.push(k*864e5);p.push(price.get(k));r.push(a/b);
  });
  const s=[...r].sort((a,b)=>a-b), q=f=>s[Math.floor(f*(s.length-1))];
  S={d,p,r,med:q(.5),lo:q(0),hi:q(.95),hx:d.length-1,hy:null};
  draw();
}

function niceTicks(a,b,cnt){
  const raw=(b-a)/cnt,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const st=(f<1.5?1:f<3.5?2:f<7.5?5:10)*mag,out=[];
  for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st) out.push(+v.toFixed(10));
  return out;
}

function color(r,a=1){
  const {med,lo,hi}=S;
  const gm=+$('gs').value;
  const t=r>=med?.5+.5*Math.pow(Math.min(1,(r-med)/(hi-med||1)),.8):.5-.5*Math.pow(Math.min(1,(med-r)/(med-lo||1)),gm);
  return `hsla(${120-120*t} 65% 45% / ${a})`;
}

function draw(){
  if(!S) return;
  const cv=$('c'), dpr=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);
  const fg=css.getPropertyValue('--btc'),mut=css.getPropertyValue('--mut'),line=css.getPropertyValue('--line');
  const L=56,R=14,n=S.d.length,pw=W-L-R,x=i=>L+pw*i/(n-1);
  const t1=10,b1=H*.6,t2=H*.68,b2=H-30;
  // price panel (log)
  const lp=S.p.map(Math.log),pmin=Math.min(...lp),pmax=Math.max(...lp),pad=(pmax-pmin)*.05;
  const yp=v=>b1-(Math.log(v)-(pmin-pad))/(pmax-pmin+2*pad)*(b1-t1);
  const bw=pw/n+1;
  for(let i=0;i<n;i++){g.fillStyle=color(S.r[i],.4);g.fillRect(x(i)-bw/2,t1,bw,b1-t1)}
  g.font='12px system-ui';g.fillStyle=mut;g.textAlign='right';g.strokeStyle=line;g.lineWidth=1;
  for(const v of niceTicks(Math.exp(pmin),Math.exp(pmax),5)){const y=yp(v);g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillText('$'+(v>=1000?+(v/1000).toFixed(1)+'k':v),L-6,y+4)}
  g.beginPath();S.p.forEach((v,i)=>i?g.lineTo(x(i),yp(v)):g.moveTo(x(i),yp(v)));
  g.strokeStyle=fg;g.lineWidth=2;g.stroke();
  // ratio panel
  const rmin=Math.min(...S.r)*.95,rmax=Math.max(...S.r)*1.05,yr=v=>b2-(v-rmin)/(rmax-rmin)*(b2-t2);
  g.strokeStyle=line;g.lineWidth=1;g.fillStyle=mut;
  for(const v of niceTicks(rmin,rmax,4)){const y=yr(v);g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillText(v.toFixed(1)+'x',L-6,y+4)}
  g.setLineDash([5,4]);g.strokeStyle=mut;g.beginPath();g.moveTo(L,yr(S.med));g.lineTo(W-R,yr(S.med));g.stroke();g.setLineDash([]);
  g.textAlign='left';g.fillText('median '+S.med.toFixed(2)+'x',L+6,yr(S.med)-5);
  g.lineWidth=2;
  for(let i=1;i<n;i++){g.beginPath();g.moveTo(x(i-1),yr(S.r[i-1]));g.lineTo(x(i),yr(S.r[i]));g.strokeStyle=color(S.r[i]);g.stroke()}
  // x axis
  g.fillStyle=mut;g.textAlign='center';
  const months=(S.d[n-1]-S.d[0])/2.63e9,step=Math.max(1,Math.ceil(months/9));let last=-1,c=0;
  for(let i=0;i<n;i++){const dt=new Date(S.d[i]),m=dt.getUTCFullYear()*12+dt.getUTCMonth();
    if(m!==last){last=m;if(c++%step===0)g.fillText(dt.toLocaleDateString('en',{month:'short',year:'2-digit',timeZone:'UTC'}),x(i),H-8)}}
  S.geo={L,pw,n,t1,b1,t2,b2,pmin,pad,pmax,rmin,rmax,x,yp,yr,W,H,R,dpr};
  const ov=$('o');ov.width=W*dpr;ov.height=H*dpr;
  cross();
}
function cross(){
  if(!S) return;
  const {L,pw,n,t1,b1,t2,b2,pmin,pad,pmax,rmin,rmax,x,yp,yr,W,H,R,dpr}=S.geo;
  const g=$('o').getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement),fg=css.getPropertyValue('--btc'),mut=css.getPropertyValue('--mut');
  if(S.hx!=null){
    const i=S.hx,cx=x(i),bg=css.getPropertyValue('--bg').trim();
    const y=S.hy==null?null:Math.min(Math.max(S.hy,t1),b2);
    const inTop=y!=null&&y<=b1, inBot=y!=null&&y>=t2;
    g.save();g.setLineDash([4,4]);g.lineWidth=1;g.strokeStyle=mut;
    g.beginPath();g.moveTo(cx,t1);g.lineTo(cx,b2);g.stroke();
    if(inTop||inBot){g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke()}
    g.restore();
    for(const yy of [yp(S.p[i]),yr(S.r[i])]){g.beginPath();g.arc(cx,yy,4,0,7);g.fillStyle=fg;g.fill();g.strokeStyle=bg;g.lineWidth=2;g.stroke()}
    const pill=(txt,cxp,cyp,right)=>{
      g.font='12px system-ui';const w=g.measureText(txt).width+12;
      let rx=right?cxp-w:cxp-w/2;rx=Math.max(0,Math.min(W-w,rx));
      g.fillStyle=fg;g.fillRect(rx,cyp-10,w,20);
      g.fillStyle=bg;g.textAlign='center';g.fillText(txt,rx+w/2,cyp+4);
    };
    if(inTop){const v=Math.exp(pmin-pad+(b1-y)/(b1-t1)*(pmax-pmin+2*pad));pill('$'+(v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)),L-2,y,true)}
    if(inBot){pill((rmin+(b2-y)/(b2-t2)*(rmax-rmin)).toFixed(2)+'x',L-2,y,true)}
    pill(new Date(S.d[i]).toISOString().slice(0,10),cx,H-14,false);
  }
}

$('o').addEventListener('mousemove',e=>{
  if(!S) return;
  const {L,pw,n}=S.geo,i=Math.round((e.offsetX-L)/pw*(n-1));
  if(i<0||i>=n) return;
  S.hx=i;S.hy=e.offsetY;cross();
  $('read').textContent=`${new Date(S.d[i]).toISOString().slice(0,10)}  BTC $${Math.round(S.p[i]).toLocaleString()}  ·  Total/BTC (7D) ${S.r[i].toFixed(2)}x`;
});
try{
  const sk=localStorage.getItem('cg_key');
  if(sk){$('key').value=sk;$('rem').checked=true;$('plan').value=localStorage.getItem('cg_plan')||'demo'}
}catch(e){}
function saveKey(){
  try{
    if($('rem').checked){localStorage.setItem('cg_key',$('key').value.trim());localStorage.setItem('cg_plan',$('plan').value)}
    else{localStorage.removeItem('cg_key');localStorage.removeItem('cg_plan')}
  }catch(e){}
}
$('rem').addEventListener('change',saveKey);
$('gs').addEventListener('change',()=>draw());
$('o').addEventListener('mouseleave',()=>{if(!S)return;S.hx=S.d.length-1;S.hy=null;cross();$('read').textContent=''});
addEventListener('keydown',e=>{
  if(!S||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const n=S.d.length,st=e.shiftKey?7:1;let i=S.hx==null?n-1:S.hx;
  if(e.key==='ArrowLeft')i-=st;else if(e.key==='ArrowRight')i+=st;else if(e.key==='Home')i=0;else if(e.key==='End')i=n-1;else return;
  e.preventDefault();
  i=Math.max(0,Math.min(n-1,i));
  S.hx=i;S.hy=S.geo.yp(S.p[i]);cross();
  $('read').textContent=`${new Date(S.d[i]).toISOString().slice(0,10)}  BTC $${Math.round(S.p[i]).toLocaleString()}  ·  Total/BTC (7D) ${S.r[i].toFixed(2)}x`;
});
$('go').addEventListener('click',()=>{saveKey();run()});
addEventListener('resize',draw);
</script>
</body>
</html>
